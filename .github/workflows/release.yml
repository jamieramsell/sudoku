name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github          # matches <id>github</id> in pom.xml's distributionManagement
          cache: maven
      # `deploy` runs the full lifecycle (compile, test, Checkstyle) before uploading,
      # so a broken build is never published. setup-java wires the `github` server to
      # GITHUB_ACTOR / GITHUB_TOKEN, both provided automatically by Actions.
      - name: Deploy to GitHub Packages
        run: ./mvnw -B deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
